<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Falling Piano</title>
<style>
  :root {
    --bg: #050403;
    --panel: #0d0b09;
    --panel-2: #131110;
    --accent: #a97c50;
    --accent-dim: #6b5138;
    --text: #f2ede4;
    --muted: #8c8378;
    --border: rgba(255,255,255,0.07);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Landing ---------- */
  #landing {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  #landing.hidden { display: none; }
  #landing h1 {
    font-size: clamp(2.5rem, 6vw, 4.2rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 1rem;
    background: linear-gradient(180deg, #fff, var(--muted));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #landing p {
    font-size: 1.15rem;
    color: var(--muted);
    max-width: 32rem;
    margin: 0 0 2.5rem;
    line-height: 1.6;
  }
  .cta {
    background: var(--accent);
    color: #12100d;
    border: none;
    padding: 0.9rem 2.2rem;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .cta:hover { background: #bf9066; transform: translateY(-1px); }
  .cta:active { transform: translateY(0); }

  /* ---------- App ---------- */
  #app {
    display: none;
    min-height: 100vh;
    padding: 3rem 1.5rem 4rem;
    align-items: flex-start;
    justify-content: center;
  }
  #app.visible { display: flex; }
  .container { width: 100%; max-width: 760px; }
  .app-title { font-size: 1.05rem; font-weight: 600; margin: 0 0 0.25rem; letter-spacing: -0.01em; }
  .app-sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 2rem; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.75rem;
  }

  .upload-zone {
    border: 1px dashed rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 3rem 1rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .upload-zone:hover { border-color: var(--accent); background: rgba(169,124,80,0.04); }
  .upload-zone input { display: none; }
  .upload-zone .hint { color: var(--muted); font-size: 0.82rem; margin-top: 0.4rem; }

  #seekRow {
    display: none;
    align-items: center;
    gap: 10px;
    margin-bottom: 0.75rem;
  }
  #seekTime { font-size: 0.78rem; color: var(--muted); min-width: 38px; }
  input[type="range"]#seekbar {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    border-radius: 999px;
    background: linear-gradient(to right, var(--accent) 0%, var(--accent) 0%, var(--panel-2) 0%, var(--panel-2) 100%);
    outline: none;
  }
  input[type="range"]#seekbar::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #12100d;
    cursor: pointer;
    transition: background 0.1s ease, transform 0.1s ease;
  }
  input[type="range"]#seekbar.dragging::-webkit-slider-thumb {
    background: #f2ede4;
    transform: scale(1.3);
  }
  input[type="range"]#seekbar::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #12100d;
    cursor: pointer;
  }
  input[type="range"]#seekbar.dragging::-moz-range-thumb { background: #f2ede4; }

  #videoPreview {
    width: 100%;
    max-height: 220px;
    border-radius: 12px 12px 0 0;
    display: none;
    background: #000;
  }

  button.control {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.55rem 1.1rem;
    font-size: 0.9rem;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  button.control:hover { border-color: var(--accent-dim); }
  button.control.primary { background: var(--accent); color: #12100d; border-color: var(--accent); font-weight: 600; }
  button.control.primary:hover { background: #bf9066; }
  button.control:disabled { opacity: 0.4; cursor: not-allowed; }

  #controls {
    display: none;
    align-items: center;
    gap: 10px;
    margin: 1.25rem 0 1rem;
    flex-wrap: wrap;
  }
  select.control {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.5rem 0.7rem;
    font-size: 0.85rem;
  }

  #stage {
    position: relative;
    width: 100%;
    height: 300px;
    background: #08070609;
    background: #08070f;
    border-radius: 12px 12px 0 0;
    overflow: hidden;
    display: none;
  }
  #keyboard {
    position: relative;
    width: 100%;
    height: 84px;
    background: #08070f;
    border-radius: 0 0 12px 12px;
    display: none;
    border-top: 1px solid rgba(0,0,0,0.5);
  }
  .white-key {
    position: absolute; top: 0; height: 100%;
    background: #efe9de;
    border: 1px solid #0a0908;
    border-radius: 0 0 4px 4px;
    transition: background 0.05s ease;
  }
  .black-key {
    position: absolute; top: 0; height: 60%;
    background: #17140f;
    border-radius: 0 0 3px 3px;
    z-index: 2;
    transition: background 0.05s ease;
  }
  .white-key.lit { background: #d9b892; }
  .black-key.lit { background: var(--accent); }

  #status { color: var(--muted); font-size: 0.85rem; margin-top: 1rem; min-height: 1.2em; }
</style>
</head>
<body>

<div id="landing">
  <h1>Falling Piano</h1>
  <p>Upload a piano recording and watch it fall into place, note by note, played back exactly as you recorded it.</p>
  <button class="cta" id="getStarted">Get started</button>
</div>

<div id="app">
  <div class="container">
    <p class="app-title">Falling Piano</p>
    <p class="app-sub">Upload a piano recording to transcribe it</p>

    <div class="card">
      <div class="upload-zone" id="dropZone">
        <input type="file" id="fileInput" accept="audio/*,video/*" />
        <div>Click to choose a file, or drag one here</div>
        <div class="hint">MP3, WAV, M4A, MP4, MOV — up to 60MB</div>
      </div>

      <video id="videoPreview" playsinline></video>

      <div id="controls">
        <button class="control primary" id="playBtn">Play</button>
        <select class="control" id="speedSelect">
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1" selected>1x</option>
          <option value="1.25">1.25x</option>
        </select>
        <button class="control" id="transposeBtn" title="Paid feature">Transpose (Pro)</button>
      </div>

      <div id="seekRow">
        <span id="seekTime">0:00</span>
        <input type="range" id="seekbar" min="0" max="100" value="0" step="0.1" />
        <span id="seekDuration">0:00</span>
      </div>

      <div id="stage"><svg id="lanes" width="100%" height="100%" preserveAspectRatio="none"></svg></div>
      <div id="keyboard"></div>
      <div id="status"></div>
      <audio id="player" style="display:none"></audio>
    </div>
  </div>
</div>

<script>
// Point this at your deployed backend.
const API_URL = "https://black-key-production.up.railway.app";

const landing = document.getElementById("landing");
const app = document.getElementById("app");
document.getElementById("getStarted").addEventListener("click", () => {
  landing.classList.add("hidden");
  app.classList.add("visible");
});

const fileInput = document.getElementById("fileInput");
const dropZone = document.getElementById("dropZone");
const statusEl = document.getElementById("status");
const stage = document.getElementById("stage");
const lanes = document.getElementById("lanes");
const controls = document.getElementById("controls");
const playBtn = document.getElementById("playBtn");
const speedSelect = document.getElementById("speedSelect");
const player = document.getElementById("player");

dropZone.addEventListener("click", () => fileInput.click());
dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.style.borderColor = "var(--accent)"; });
dropZone.addEventListener("dragleave", () => { dropZone.style.borderColor = "rgba(255,255,255,0.15)"; });
dropZone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropZone.style.borderColor = "rgba(255,255,255,0.15)";
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", () => {
  if (fileInput.files.length) handleFile(fileInput.files[0]);
});

const MIN_PITCH = 21, MAX_PITCH = 108;
const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const IS_BLACK = [false,true,false,true,false,false,true,false,true,false,true,false];
function pitchName(midi) { return NOTE_NAMES[midi % 12] + (Math.floor(midi / 12) - 1); }
function fmtTime(s) {
  if (!isFinite(s)) return "0:00";
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, "0")}`;
}

const videoPreview = document.getElementById("videoPreview");
const seekRow = document.getElementById("seekRow");
const seekbar = document.getElementById("seekbar");
const seekTime = document.getElementById("seekTime");
const seekDuration = document.getElementById("seekDuration");

let playing = false;
let animFrame;
let activePlayer = player; // switches to videoPreview when the upload is a video
let seeking = false;

const VIDEO_EXT = [".mp4", ".mov", ".m4v", ".webm"];

async function handleFile(file) {
  statusEl.textContent = "Uploading and transcribing... this can take a few seconds.";
  stage.style.display = "none";
  controls.style.display = "none";
  seekRow.style.display = "none";
  document.getElementById("keyboard").style.display = "none";

  const isVideo = VIDEO_EXT.some(ext => file.name.toLowerCase().endsWith(ext)) || file.type.startsWith("video/");
  const objectUrl = URL.createObjectURL(file);

  if (isVideo) {
    videoPreview.src = objectUrl;
    videoPreview.style.display = "block";
    player.style.display = "none";
    activePlayer = videoPreview;
  } else {
    player.src = objectUrl;
    videoPreview.style.display = "none";
    activePlayer = player;
  }
  if (!activePlayer.dataset.bound) {
    bindPlayerEvents(activePlayer);
    activePlayer.dataset.bound = "true";
  }

  const formData = new FormData();
  formData.append("file", file);

  try {
    const res = await fetch(`${API_URL}/transcribe`, { method: "POST", body: formData });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `Server error (${res.status})`);
    }
    const data = await res.json();
    statusEl.textContent = `Done. ${data.notes.length} notes detected. ${data.uses_remaining} free uses left this month.`;
    renderNotes(data.notes);
    stage.style.display = "block";
    document.getElementById("keyboard").style.display = "block";
    controls.style.display = "flex";
    seekRow.style.display = "flex";
  } catch (err) {
    statusEl.textContent = `Something went wrong: ${err.message}`;
  }
}

function renderNotes(notes) {
  lanes.innerHTML = "";
  const laneCount = MAX_PITCH - MIN_PITCH + 1;
  const stageWidth = 700, stageHeight = 300;
  const pxPerSecond = 90;
  lanes.setAttribute("viewBox", `0 0 ${stageWidth} ${stageHeight}`);
  const laneWidth = stageWidth / laneCount;

  notes.forEach((n) => {
    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    const x = (n.pitch - MIN_PITCH) * laneWidth;
    const h = Math.max(4, n.duration * pxPerSecond);
    rect.setAttribute("x", x + 1);
    rect.setAttribute("width", Math.max(2, laneWidth - 2));
    rect.setAttribute("height", h);
    rect.setAttribute("rx", 2);
    rect.setAttribute("fill", IS_BLACK[n.pitch % 12] ? "#c98a4a" : "#a97c50");
    rect.setAttribute("data-y0", -(h + n.start_time * pxPerSecond));
    rect.setAttribute("data-pitch", n.pitch);
    rect.setAttribute("data-start", n.start_time);
    rect.setAttribute("data-end", n.start_time + n.duration);
    rect.setAttribute("y", rect.getAttribute("data-y0"));
    lanes.appendChild(rect);
  });

  renderKeyboard();

  if (notes.length) {
    const firstFew = notes.slice(0, 8).map(n => pitchName(n.pitch)).join(", ");
    statusEl.textContent += ` First notes detected: ${firstFew}${notes.length > 8 ? "..." : ""}`;
  }
}

function renderKeyboard() {
  const kb = document.getElementById("keyboard");
  kb.innerHTML = "";
  const whiteKeys = [];
  for (let p = MIN_PITCH; p <= MAX_PITCH; p++) if (!IS_BLACK[p % 12]) whiteKeys.push(p);
  const whiteWidth = 100 / whiteKeys.length;

  whiteKeys.forEach((p, i) => {
    const key = document.createElement("div");
    key.className = "white-key";
    key.dataset.pitch = p;
    key.style.left = (i * whiteWidth) + "%";
    key.style.width = whiteWidth + "%";
    kb.appendChild(key);
  });

  for (let p = MIN_PITCH; p <= MAX_PITCH; p++) {
    if (!IS_BLACK[p % 12]) continue;
    const whiteIndexBefore = whiteKeys.filter(w => w < p).length - 1;
    const key = document.createElement("div");
    key.className = "black-key";
    key.dataset.pitch = p;
    key.style.left = ((whiteIndexBefore + 1) * whiteWidth - whiteWidth * 0.3) + "%";
    key.style.width = (whiteWidth * 0.6) + "%";
    kb.appendChild(key);
  }
}

// Playback is driven entirely by the active element's own clock, so
// pausing and resuming naturally stays where you left off, and video
// files stay in sync with the falling notes the same way audio does.
playBtn.addEventListener("click", () => {
  if (playing) {
    activePlayer.pause();
  } else {
    activePlayer.play();
  }
});

function bindPlayerEvents(el) {
  el.addEventListener("play", () => {
    playing = true;
    playBtn.textContent = "Pause";
    tick();
  });
  el.addEventListener("pause", () => {
    playing = false;
    playBtn.textContent = "Play";
    cancelAnimationFrame(animFrame);
  });
  el.addEventListener("ended", () => {
    playing = false;
    playBtn.textContent = "Play";
  });
  el.addEventListener("loadedmetadata", () => {
    seekbar.max = el.duration || 0;
    seekDuration.textContent = fmtTime(el.duration);
  });
  el.addEventListener("timeupdate", () => {
    if (seeking) return;
    seekbar.value = el.currentTime;
    seekTime.textContent = fmtTime(el.currentTime);
    updateSeekFill();
  });
}

function updateSeekFill() {
  const pct = seekbar.max > 0 ? (seekbar.value / seekbar.max) * 100 : 0;
  seekbar.style.background = `linear-gradient(to right, var(--accent) ${pct}%, var(--panel-2) ${pct}%)`;
}

seekbar.addEventListener("mousedown", () => { seeking = true; seekbar.classList.add("dragging"); });
seekbar.addEventListener("touchstart", () => { seeking = true; seekbar.classList.add("dragging"); });
seekbar.addEventListener("input", () => {
  seekTime.textContent = fmtTime(parseFloat(seekbar.value));
  updateSeekFill();
  positionNotesAt(parseFloat(seekbar.value));
});
function commitSeek() {
  activePlayer.currentTime = parseFloat(seekbar.value);
  seeking = false;
  seekbar.classList.remove("dragging");
}
seekbar.addEventListener("mouseup", commitSeek);
seekbar.addEventListener("touchend", commitSeek);
seekbar.addEventListener("change", commitSeek);

speedSelect.addEventListener("change", () => {
  activePlayer.playbackRate = parseFloat(speedSelect.value);
});

function positionNotesAt(elapsed) {
  const stageHeight = 300;
  const pxPerSecond = 90;
  document.querySelectorAll("#lanes rect").forEach((rect) => {
    const y0 = parseFloat(rect.getAttribute("data-y0"));
    rect.setAttribute("y", y0 + elapsed * pxPerSecond + stageHeight);
  });
  document.querySelectorAll(".white-key, .black-key").forEach(k => k.classList.remove("lit"));
  document.querySelectorAll("#lanes rect").forEach((rect) => {
    const start = parseFloat(rect.getAttribute("data-start"));
    const end = parseFloat(rect.getAttribute("data-end"));
    if (elapsed >= start && elapsed <= end) {
      const pitch = rect.getAttribute("data-pitch");
      const keyEl = document.querySelector(`[data-pitch="${pitch}"]`);
      if (keyEl) keyEl.classList.add("lit");
    }
  });
}

function tick() {
  positionNotesAt(activePlayer.currentTime);
  if (playing) animFrame = requestAnimationFrame(tick);
}

document.getElementById("transposeBtn").addEventListener("click", () => {
  alert("Transposing is a paid feature. Hook this up to your upgrade/checkout flow.");
});
</script>
</body>
</html>
